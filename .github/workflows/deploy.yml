name: CampusWhisper CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─── 1. Test ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, post-service, feed-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

  # ─── 2. Build & Push Docker Images ───────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [user-service, post-service, feed-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/campuswhisper-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/campuswhisper-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Build Frontend ────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/campuswhisper-frontend:latest
            ${{ env.DOCKERHUB_USERNAME }}/campuswhisper-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 4. Deploy to Kubernetes ──────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Update image tags in manifests
        run: |
          sed -i "s|:latest|:${{ env.IMAGE_TAG }}|g" k8s/services.yaml
          sed -i "s|:latest|:${{ env.IMAGE_TAG }}|g" k8s/user-service.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/user-service.yaml
          kubectl apply -f k8s/services.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/user-service --timeout=120s
          kubectl rollout status deployment/post-service --timeout=120s
          kubectl rollout status deployment/feed-service --timeout=120s
          kubectl rollout status deployment/api-gateway --timeout=120s

      - name: Verify deployment
        run: kubectl get pods -l app=api-gateway

      - name: Notify on success
        if: success()
        run: echo "✅ CampusWhisper deployed successfully - ${{ env.IMAGE_TAG }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed - check logs"
